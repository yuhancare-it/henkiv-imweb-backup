<!-- 6번 섹션 - HENKIV 연구 마무리 CTA -->
<style>
  /* 제목 - 크게 아래→위 페이드인 */
  #w202604083cfe871c736df .widget_text_wrap {
    opacity: 0;
    transform: translateY(36px);
    transition: opacity 1.3s ease, transform 1.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #w202604083cfe871c736df.henkiv-fade-in .widget_text_wrap {
    opacity: 1;
    transform: translateY(0);
  }

  /* 본문 */
  #w202604086777f66b0ab96 .widget_text_wrap {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 1s ease 0.35s, transform 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s;
  }
  #w202604086777f66b0ab96.henkiv-fade-in .widget_text_wrap {
    opacity: 1;
    transform: translateY(0);
  }

  /* 글래스 원 3개 - 팝업 순차 등장 */
  #w202604084876458a87757 .yhc-glass-circle {
    opacity: 0;
    transform: translateY(50px) scale(0.85);
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #w202604084876458a87757.henkiv-circles-in .yhc-glass-circle:nth-child(1) {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition-delay: 0.1s;
  }
  #w202604084876458a87757.henkiv-circles-in .yhc-glass-circle:nth-child(2) {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition-delay: 0.3s;
  }
  #w202604084876458a87757.henkiv-circles-in .yhc-glass-circle:nth-child(3) {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition-delay: 0.5s;
  }

  /* 반응형 */
  @media screen and (max-width: 768px) {
    #w202604083cfe871c736df .widget_text_wrap {
      transition-duration: 1s;
    }
    #w202604084876458a87757 .yhc-glass-circle {
      transform: translateY(30px) scale(0.9);
      transition-duration: 0.7s;
    }
    #w202604084876458a87757.henkiv-circles-in .yhc-glass-circle:nth-child(1),
    #w202604084876458a87757.henkiv-circles-in .yhc-glass-circle:nth-child(2),
    #w202604084876458a87757.henkiv-circles-in .yhc-glass-circle:nth-child(3) {
      transform: translateY(0) scale(1);
    }
  }
</style>

<script>
(function () {

  var titleEl   = document.querySelector('#w202604083cfe871c736df');  /* 제목 */
  var bodyEl    = document.querySelector('#w202604086777f66b0ab96');  /* 본문 */
  var circleEl  = document.querySelector('#w202604084876458a87757');  /* 글래스 원 */

  /* 텍스트 Observer */
  var fadeObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('henkiv-fade-in');
      fadeObserver.unobserve(entry.target);
    });
  }, { threshold: 0.2 });

  /* 글래스 원 Observer */
  var circleObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('henkiv-circles-in');
      circleObserver.unobserve(entry.target);
    });
  }, { threshold: 0.2 });

  if (titleEl)  fadeObserver.observe(titleEl);
  if (bodyEl)   fadeObserver.observe(bodyEl);
  if (circleEl) circleObserver.observe(circleEl);

})();
</script>
