<!-- 2번 섹션 - 대자연 + 사슴 소개 애니메이션 -->
<style>
  /* 이미지/동영상 위젯 - 좌우로 열리는 효과 */
  #w202604135544843703401 .img_wrap {
    clip-path: inset(0 50% 0 50%);
    transition: clip-path 1.2s cubic-bezier(0.65, 0, 0.35, 1);
  }
  #w202604135544843703401.henkiv-reveal .img_wrap {
    clip-path: inset(0 0% 0 0%);
  }

  /* 제목 텍스트 - 아래→위 페이드인 */
  #w202604088684ca4f18849 .widget_text_wrap {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 1s ease, transform 1s ease;
  }
  #w202604088684ca4f18849.henkiv-fade-in .widget_text_wrap {
    opacity: 1;
    transform: translateY(0);
  }

  /* 본문 텍스트 - 아래→위 페이드인 */
  #w20260408615c8c82834c8 .widget_text_wrap {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 1s ease, transform 1s ease;
  }
  #w20260408615c8c82834c8.henkiv-fade-in .widget_text_wrap {
    opacity: 1;
    transform: translateY(0);
  }

  /* 반응형 */
  @media screen and (max-width: 768px) {
    #w202604135544843703401 .img_wrap {
      transition: clip-path 1s cubic-bezier(0.65, 0, 0.35, 1);
    }
    #w202604088684ca4f18849 .widget_text_wrap,
    #w20260408615c8c82834c8 .widget_text_wrap {
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
  }
</style>

<script>
(function () {
  var mediaEl  = document.querySelector('#w202604135544843703401');  /* 이미지/동영상 */
  var titleEl  = document.querySelector('#w202604088684ca4f18849');  /* 제목 텍스트 */
  var bodyEl   = document.querySelector('#w20260408615c8c82834c8');  /* 본문 텍스트 */

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;

      var el = entry.target;

      if (el.id === 'w202604135544843703401') {
        /* 이미지/동영상 - 좌우로 열리기 */
        el.classList.add('henkiv-reveal');

      } else if (el.id === 'w202604088684ca4f18849') {
        /* 제목 - 0.1s 딜레이 */
        setTimeout(function () {
          el.classList.add('henkiv-fade-in');
        }, 100);

      } else if (el.id === 'w20260408615c8c82834c8') {
        /* 본문 - 0.4s 딜레이 */
        setTimeout(function () {
          el.classList.add('henkiv-fade-in');
        }, 400);
      }

      observer.unobserve(el);
    });
  }, { threshold: 0.3 });

  if (mediaEl) observer.observe(mediaEl);
  if (titleEl)  observer.observe(titleEl);
  if (bodyEl)   observer.observe(bodyEl);
})();
</script>
