<style>

.yhc-tl-img.active {

}

/* 텍스트 래퍼 */

  position: absolute;

}

  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
  white-space: nowrap;
}

.yhc-tl-text.active {
  opacity: 1;

}

/* 연도 라벨 */

<script>
/* ========================================
   [yhc] 타임라인 전환 - 클릭 + 자동(4초)
   ======================================== */
(function() {
  var INTERVAL = 4000;
  var current = 0;
  var total = 3;
  var timer = null;
  var currentDeerClass = 'yhc-tl-deer-odd';

  var yearItems = document.querySelectorAll('.yhc-tl-year-item');
  var years     = document.querySelectorAll('.yhc-tl-year');
  var imgs      = document.querySelectorAll('.yhc-tl-img');
  var texts     = document.querySelectorAll('.yhc-tl-text');

  function goTo(index) {
    yearItems[current].classList.remove('active');
    imgs[current].classList.remove('active');
    texts[current].classList.remove('active');

    var prevDeers = yearItems[current].querySelectorAll('.yhc-tl-deer');
    prevDeers.forEach(function(d) { d.classList.remove('active'); });

    current = index;
    yearItems[current].classList.add('active');
    imgs[current].classList.add('active');
    texts[current].classList.add('active');

    currentDeerClass = (currentDeerClass === 'yhc-tl-deer-odd')
      ? 'yhc-tl-deer-even'
      : 'yhc-tl-deer-odd';

    var nextDeer = yearItems[current].querySelector('.' + currentDeerClass);
    if (nextDeer) nextDeer.classList.add('active');
  }

  function startAuto() {
    timer = setInterval(function() {
      goTo((current + 1) % total);
    }, INTERVAL);
  }

  function resetAuto() {
    clearInterval(timer);
    startAuto();
  }

  years.forEach(function(el) {
    el.addEventListener('click', function() {
      var index = parseInt(el.getAttribute('data-index'), 10);
      if (index === current) return;
      goTo(index);
      resetAuto();
    });
  });

  var initDeer = yearItems[0].querySelector('.yhc-tl-deer-odd');
  if (initDeer) initDeer.classList.add('active');

  startAuto();
})();

/* ========================================
   [yhc] 스크롤 등장 애니메이션
   ======================================== */
(function() {
  var targets = [
    document.querySelector('.yhc-tl-circle'),
    document.querySelector('.yhc-tl-text-wrap'),
    document.querySelector('.yhc-tl-bar')
  ];

  var trigger = document.querySelector('.yhc-tl-wrap');
  if (!trigger) return;

  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      targets.forEach(function(el) {
        if (el) el.classList.add('yhc-tl-visible');
      });
      obs.unobserve(entry.target);
    });
  }, { threshold: 0.2 });

  obs.observe(trigger);
})();
</script>
